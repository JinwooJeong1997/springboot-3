name: deploy

on:
  push:
    branches:
      - "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 리포 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. QEMU, Buildx 세팅 (멀티 아키텍처 빌드)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Spring Boot 이미지 빌드 & 푸시
      # (5/6번 스텝 및 서버 yml에서 어떤 태그를 쓰더라도 맞출 수 있도록 2.0과 latest를 동시 푸시)
      - name: Build & Push Spring Boot Image
        uses: docker/build-push-action@v6
        with:
          context: ./springboot-app
          file: ./springboot-app/Dockerfile
          push: true
          tags: |
            jinwoojeong12/hub-node-img:latest
          platforms: linux/amd64

      # 5. EC2 원격 접속 및 배포 실행 (서브 디렉터리 배포)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            mkdir -p ~/springboot3/springboot3-web3
            cd ~/springboot3/springboot3-web3

            # Docker Hub 최신 이미지 pull 및 강제 재생성
            docker pull jinwoojeong12/hub-node-img:latest
            docker compose down || true
            docker compose up -d --force-recreate --remove-orphans

            # 사용하지 않는 구버전 도커 이미지 정리
            docker image prune -f

      # 6. SSH로 EC2 접속 → docker compose 배포 (메인 디렉터리 배포)
      - name: Deploy via SSH (compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            cd ~/springboot3
            # (Docker Hub가 비공개 레포일 때만 필요)
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "Docker Hub login..."
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi
            # 최신 이미지 pull 및 강제 재생성 기동 (--build 대신 --force-recreate 적용)
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            # 상태 확인
            docker compose ps
            # 사용하지 않는 구버전 이미지 정리
            docker image prune -f